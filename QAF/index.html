<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qur'anic Arabic Root & Morphology Explorer</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #105652;
      --primary-light: #187771;
      --primary-dark: #093936;
      --accent: #c49751;
      --accent-light: #f7ebd4;
      --bg-main: #fbf9f5;
      --surface: #ffffff;
      --surface-subtle: #faf7f2;
      --border: #e6dfd5;
      --text-dark: #1f2421;
      --text-muted: #5c6460;
      --table-alt: #faf8f5;
      --font-arabic: 'Amiri', 'Amiri Quran', serif;
      --font-urdu: 'Noto Nastaliq Urdu', serif;
      --font-latin: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --primary: #2fa198;
      --primary-light: #3dbcb1;
      --primary-dark: #121f1d;
      --accent: #d8aa60;
      --accent-light: #2b2518;
      --bg-main: #121514;
      --surface: #1a1f1d;
      --surface-subtle: #222926;
      --border: #2c3632;
      --text-dark: #e8ece9;
      --text-muted: #9ba5a0;
      --table-alt: #161a18;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      font-family: var(--font-latin);
      line-height: 1.6;
      padding-bottom: 60px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, #105652 100%);
      color: #fff;
      padding: 26px 20px;
      text-align: center;
      border-bottom: 4px solid var(--accent);
      position: relative;
    }

    [data-theme="dark"] header {
      background: linear-gradient(135deg, #09100e 0%, #142825 100%);
    }

    header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 4px; }
    header p { color: var(--accent-light); font-size: 0.92rem; }

    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .controls-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .input-wrapper {
      flex: 1;
      min-width: 260px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 12px 46px 12px 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-dark);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 86, 82, 0.2);
    }

    /* Voice Search Button */
    .btn-voice {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .btn-voice:hover {
      color: var(--primary);
      background: var(--surface);
    }

    .btn-voice.listening {
      color: #e53935;
      background: rgba(229, 57, 53, 0.15);
      animation: pulseMic 1.2s infinite;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.4); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
    }

    .btn-reset {
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover { background: var(--primary-light); }

    /* Root Lexicon Card */
    .root-lexicon-card {
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .root-lexicon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .root-lexicon-title {
      font-family: var(--font-arabic);
      font-size: 2.3rem;
      font-weight: 700;
      color: var(--accent);
      direction: rtl;
    }

    .root-derivatives-panel {
      margin-top: 18px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .surah-block-header {
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .surah-block-header h2 {
      font-size: 1.4rem;
      color: var(--primary);
    }

    .ayah-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .ayah-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .ayah-badge {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid rgba(196, 151, 81, 0.3);
    }

    .ayah-arabic {
      font-family: var(--font-arabic);
      font-size: 2rem;
      text-align: right;
      direction: rtl;
      line-height: 2.2;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .translations-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .translations-grid { grid-template-columns: 1fr; }
      .theme-toggle-btn { position: static; margin: 10px auto 0 auto; }
    }

    .trans-box h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .trans-urdu {
      font-family: var(--font-urdu);
      direction: rtl;
      font-size: 1.15rem;
      line-height: 2;
    }

    .trans-english { font-size: 0.95rem; }

    .table-container {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      background: var(--surface-subtle);
      color: var(--text-dark);
      font-weight: 600;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }

    td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:nth-child(even) td { background: var(--table-alt); }

    .word-arabic {
      font-family: var(--font-arabic);
      font-size: 1.35rem;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    .word-arabic:hover { color: var(--accent); }

    .root-tag {
      font-family: var(--font-arabic);
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      display: inline-block;
      cursor: pointer;
    }

    .root-tag:hover {
      background: var(--accent);
      color: #fff;
    }

    .btn-inspect {
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-inspect:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .modal-card {
      background: var(--surface);
      color: var(--text-dark);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      max-width: 740px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: var(--surface-subtle);
      color: var(--text-dark);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .context-phrase {
      font-family: var(--font-arabic);
      direction: rtl;
      font-size: 1.25rem;
      color: var(--primary);
      line-height: 1.9;
      background: var(--surface-subtle);
      padding: 8px 12px;
      border-radius: 6px;
      border-right: 3px solid var(--accent);
      margin-bottom: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }
  </style>

  <script src="data.js"></script>
</head>
<body>

  <header>
    <button class="theme-toggle-btn" id="themeToggleBtn">
      <span id="themeIcon">🌙</span> <span id="themeText">Dark Theme</span>
    </button>
    <h1>📖 Qur'anic Arabic Root & Morphology Explorer</h1>
    <p>Search roots in Arabic or English transliteration (e.g. KTB, RBB), or click the microphone for voice search</p>
  </header>

  <div class="container">
    <div class="controls-card">
      <div class="search-row">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search Root (e.g. KTB, RBB, كتب), English, or Urdu..."
          />
          <button id="voiceBtn" class="btn-voice" title="Voice Search (Click and speak)">🎤</button>
        </div>
        <button id="resetBtn" class="btn-reset">Reset</button>
      </div>
    </div>

    <!-- Dynamic Root Lexicon Display -->
    <div id="rootLexiconContainer"></div>

    <!-- Ayahs Section -->
    <div id="resultsContainer"></div>
  </div>

  <!-- Detailed Modal -->
  <div id="morphologyModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. THEME MANAGEMENT
    // ==========================================
    const currentTheme = localStorage.getItem("quranAppTheme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);
    updateThemeButtonUI(currentTheme);

    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      const activeTheme = document.documentElement.getAttribute("data-theme");
      const nextTheme = activeTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("quranAppTheme", nextTheme);
      updateThemeButtonUI(nextTheme);
    });

    function updateThemeButtonUI(theme) {
      const icon = document.getElementById("themeIcon");
      const text = document.getElementById("themeText");
      if (theme === "dark") {
        icon.innerText = "☀️";
        text.innerText = "Light Theme";
      } else {
        icon.innerText = "🌙";
        text.innerText = "Dark Theme";
      }
    }

    // ==========================================
    // 2. ENGLISH TRANSLITERATION MAPPER
    // ==========================================
    const translitMap = {
      'a': 'ا', 'b': 'ب', 't': 'ت', 'th': 'ث', 'j': 'ج', 'h': 'ح', 'kh': 'خ',
      'd': 'د', 'dh': 'ذ', 'r': 'ر', 'z': 'ز', 's': 'س', 'sh': 'ش', 's': 'ص',
      'd': 'ض', 't': 'ط', 'z': 'ظ', 'ayn': 'ع', 'gh': 'غ', 'f': 'ف', 'q': 'ق',
      'k': 'ك', 'l': 'ل', 'm': 'م', 'n': 'ن', 'h': 'ه', 'w': 'و', 'y': 'ي',
      'hamza': 'ء', 'alif': 'ا'
    };

    function transliterateToArabic(englishInput) {
      let clean = englishInput.toLowerCase().replace(/[^a-z]/g, '');
      if (!clean) return "";

      let arabicChars = [];
      let i = 0;
      while (i < clean.length) {
        if (i + 1 < clean.length && translitMap[clean.substring(i, i + 2)]) {
          arabicChars.push(translitMap[clean.substring(i, i + 2)]);
          i += 2;
        } else if (translitMap[clean[i]]) {
          arabicChars.push(translitMap[clean[i]]);
          i += 1;
        } else {
          i += 1;
        }
      }
      return arabicChars.join(" ");
    }

    // ==========================================
    // 3. VOICE SEARCH (WEB SPEECH API)
    // ==========================================
    const voiceBtn = document.getElementById("voiceBtn");
    const searchInput = document.getElementById("searchInput");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US'; // Supports transliterated root spells or English terms

      recognition.onstart = () => {
        voiceBtn.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        searchInput.value = transcript;
        activeFilterRoot = null;
        renderApp();
      };

      recognition.onerror = () => {
        voiceBtn.classList.remove("listening");
      };

      recognition.onend = () => {
        voiceBtn.classList.remove("listening");
      };

      voiceBtn.addEventListener("click", () => {
        if (voiceBtn.classList.contains("listening")) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });
    } else {
      voiceBtn.title = "Voice search not supported in this browser";
      voiceBtn.style.opacity = "0.5";
      voiceBtn.onclick = () => alert("Voice search is not supported in this browser. Please use Chrome, Edge, or Safari.");
    }

    // ==========================================
    // 4. DATABASE ENGINE & DERIVATIVES COLLECTOR
    // ==========================================
    const db = window.quranDatabase || [];
    let activeFilterRoot = null;

    function normalizeArabic(str) {
      if (!str) return "";
      return str
        .replace(/[\u064B-\u065F\u0670\u0653]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ي/g, "ى")
        .replace(/\s+/g, "")
        .trim()
        .toLowerCase();
    }

    function getAllUniqueRoots() {
      const set = new Set();
      db.forEach(surah => {
        if (surah.allRoots) {
          surah.allRoots.forEach(r => set.add(r));
        }
      });
      return Array.from(set);
    }

    function getRootDetails(root) {
      for (const surah of db) {
        if (surah.rootsDictionary && surah.rootsDictionary[root]) {
          return surah.rootsDictionary[root];
        }
      }
      return { root: root, urdu: "", english: "", type: "" };
    }

    function getAllDerivativesForRoot(root) {
      const derivativesMap = new Map();
      db.forEach(surah => {
        surah.ayahs.forEach(ayah => {
          ayah.words.forEach(w => {
            if (w.root === root && w.derivatives && w.derivatives.length > 0) {
              w.derivatives.forEach(d => {
                const key = `${d.word}_${d.ayah}`;
                if (!derivativesMap.has(key)) {
                  derivativesMap.set(key, d);
                }
              });
            }
          });
        });
      });
      return Array.from(derivativesMap.values());
    }

    function renderApp() {
      const container = document.getElementById("resultsContainer");
      const rootLexiconContainer = document.getElementById("rootLexiconContainer");

      if (!db || db.length === 0) {
        container.innerHTML = `<div class="empty-state"><h3>⚠️ Error loading data.js</h3><p>Make sure 'data.js' is loaded properly.</p></div>`;
        return;
      }

      const searchRaw = searchInput.value.trim();
      const searchNorm = normalizeArabic(searchRaw);
      const searchLower = searchRaw.toLowerCase();
      
      const transliteratedRoot = transliterateToArabic(searchRaw);
      const transliteratedNorm = normalizeArabic(transliteratedRoot);

      let currentActiveRoot = activeFilterRoot;
      if (!currentActiveRoot && searchRaw) {
        const allRoots = getAllUniqueRoots();
        const matchedRoot = allRoots.find(r => 
          normalizeArabic(r) === searchNorm || 
          normalizeArabic(r) === transliteratedNorm
        );
        if (matchedRoot) {
          currentActiveRoot = matchedRoot;
        }
      }

      // Render Dynamic Root Lexicon + Derivatives Matrix
      if (currentActiveRoot) {
        const rData = getRootDetails(currentActiveRoot);
        const rootDerivatives = getAllDerivativesForRoot(currentActiveRoot);

        let derivativesSectionHtml = "";
        if (rootDerivatives.length > 0) {
          derivativesSectionHtml = `
            <div class="root-derivatives-panel">
              <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--primary); font-weight:700; margin-bottom:12px;">
                🌱 Derived Qur'anic Words for Root [ ${currentActiveRoot} ] (${rootDerivatives.length} Occurrences)
              </h4>
              <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:12px;">
                ${rootDerivatives.map(d => `
                  <div style="background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                      <span style="font-family:var(--font-arabic); font-size:1.4rem; font-weight:700; color:var(--primary);">${d.word}</span>
                      <span class="ayah-badge">Ayah ${d.ayah}</span>
                    </div>
                    <div class="context-phrase" style="font-size:1.1rem; line-height:1.7;">${d.contextPhrase}</div>
                    <div style="font-size:0.88rem; font-weight:600; color:var(--text-dark); margin-top:4px;">${d.meaningEn}</div>
                    <div style="font-family:var(--font-urdu); direction:rtl; text-align:right; font-size:0.95rem; color:var(--text-muted); margin-top:2px;">${d.meaningUr}</div>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        }

        rootLexiconContainer.innerHTML = `
          <div class="root-lexicon-card">
            <div class="root-lexicon-header">
              <div>
                <span class="ayah-badge">${rData.type || 'Qur\'anic Root'}</span>
                <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
                  Transliteration: <b>${currentActiveRoot.split(' ').join('-').toUpperCase()}</b>
                </div>
              </div>
              <div class="root-lexicon-title">${currentActiveRoot}</div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
              <div>
                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">Lexical Root Meaning</div>
                <div style="font-size:1.05rem; font-weight:600; color:var(--primary); margin-top:2px;">${rData.english || '—'}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700;">بنیادی مادہ و معنوی اصل</div>
                <div style="font-family:var(--font-urdu); direction:rtl; font-size:1.15rem; color:var(--text-dark); margin-top:2px;">${rData.urdu || '—'}</div>
              </div>
            </div>

            ${derivativesSectionHtml}
          </div>
        `;
      } else {
        rootLexiconContainer.innerHTML = "";
      }

      container.innerHTML = "";
      let totalMatchedAyahs = 0;

      db.forEach(surah => {
        let surahHasMatches = false;
        const surahBlock = document.createElement("div");

        let surahContent = `
          <div class="surah-block-header">
            <h2>Surah ${surah.surahNameEnglish} — <span style="font-family:var(--font-arabic);">${surah.surahNameArabic}</span></h2>
            <span style="font-size:0.85rem; color:var(--text-muted);">Ayat ${surah.ayahRange}</span>
          </div>
        `;

        let ayahsHtml = "";

        surah.ayahs.forEach(ayah => {
          let wordsToDisplay = ayah.words;

          if (currentActiveRoot) {
            wordsToDisplay = ayah.words.filter(w => w.root === currentActiveRoot);
            if (wordsToDisplay.length === 0) return;
          } else if (searchRaw) {
            const ayahMatchesDirectly = 
              normalizeArabic(ayah.arabicText).includes(searchNorm) ||
              ayah.englishTranslation.toLowerCase().includes(searchLower) ||
              ayah.urduTranslation.toLowerCase().includes(searchLower);

            wordsToDisplay = ayah.words.filter(w => {
              const rootNorm = normalizeArabic(w.root);
              const wordNorm = normalizeArabic(w.word);
              const rootInfo = getRootDetails(w.root);

              return (
                rootNorm.includes(searchNorm) ||
                rootNorm.includes(transliteratedNorm) ||
                wordNorm.includes(searchNorm) ||
                (w.contextualEnglish && w.contextualEnglish.toLowerCase().includes(searchLower)) ||
                (w.contextualUrdu && w.contextualUrdu.includes(searchRaw)) ||
                (rootInfo.english && rootInfo.english.toLowerCase().includes(searchLower)) ||
                (rootInfo.urdu && rootInfo.urdu.includes(searchRaw))
              );
            });

            if (!ayahMatchesDirectly && wordsToDisplay.length === 0) return;
            if (ayahMatchesDirectly && wordsToDisplay.length === 0) wordsToDisplay = ayah.words;
          }

          surahHasMatches = true;
          totalMatchedAyahs++;

          let tableRows = wordsToDisplay.map(w => {
            const rootData = getRootDetails(w.root);
            return `
              <tr>
                <td>
                  <span class="word-arabic" onclick='openModal(${JSON.stringify(w).replace(/'/g, "&#39;")})'>${w.word}</span>
                </td>
                <td>
                  ${w.root && w.root !== "—" ? `<span class="root-tag" onclick='filterByRoot("${w.root}")'>${w.root}</span>` : '—'}
                </td>
                <td>
                  <div style="font-size:0.88rem; font-weight:600; color:var(--primary);">${rootData.english || '—'}</div>
                  <div style="font-size:0.88rem; color:var(--text-muted); font-family:var(--font-urdu); direction:rtl; text-align:right;">${rootData.urdu || ''}</div>
                </td>
                <td><code>${w.wazn || '—'}</code></td>
                <td>
                  <div style="font-size:0.9rem;">${w.contextualEnglish || '—'}</div>
                  <div style="font-family:var(--font-urdu); direction:rtl; text-align:right; font-size:1.02rem;">${w.contextualUrdu || ''}</div>
                </td>
                <td>
                  <button class="btn-inspect" onclick='openModal(${JSON.stringify(w).replace(/'/g, "&#39;")})'>Inspect</button>
                </td>
              </tr>
            `;
          }).join("");

          ayahsHtml += `
            <div class="ayah-card">
              <div class="ayah-header">
                <span class="ayah-badge">Ayah ${ayah.ayahKey}</span>
                <span style="font-size:0.85rem; color:var(--text-muted);">${surah.surahNameEnglish}</span>
              </div>

              <div class="ayah-arabic">${ayah.arabicText}</div>

              <div class="translations-grid">
                <div class="trans-box">
                  <h4>Urdu Translation</h4>
                  <div class="trans-urdu">${ayah.urduTranslation}</div>
                </div>
                <div class="trans-box">
                  <h4>English Translation</h4>
                  <div class="trans-english">${ayah.englishTranslation}</div>
                </div>
              </div>

              <div class="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Word (اللفظ)</th>
                      <th>Root (الجذر)</th>
                      <th>Root Meaning (اصل المعنى)</th>
                      <th>Form / Pattern (الوزن)</th>
                      <th>Contextual Meaning (سیاقی معنی)</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tableRows}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        });

        if (surahHasMatches) {
          surahBlock.innerHTML = surahContent + ayahsHtml;
          container.appendChild(surahBlock);
        }
      });

      if (totalMatchedAyahs === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No matching roots, words, or meanings found</h3>
            <p>Try searching with English transliteration (e.g. KTB, RHM), Arabic root, or click the mic button.</p>
          </div>
        `;
      }
    }

    window.openModal = function(wordObj) {
      const rootData = getRootDetails(wordObj.root);
      const modal = document.getElementById("morphologyModal");
      const modalBody = document.getElementById("modalBody");

      let derivativesHtml = "";
      if (wordObj.derivatives && wordObj.derivatives.length > 0) {
        derivativesHtml = `
          <div style="margin-top:20px; background:var(--surface-subtle); padding:16px; border-radius:8px; border:1px solid var(--border);">
            <h4 style="font-size:0.85rem; text-transform:uppercase; margin-bottom:12px; color:var(--primary);">
              🌱 Qur'anic Derivatives & Context Phrases (مشتقات مع سیاقِ قرآنی)
            </h4>
            <div style="display:flex; flex-direction:column; gap:12px;">
              ${wordObj.derivatives.map(d => `
                <div style="background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-family:var(--font-arabic); font-size:1.35rem; font-weight:700; color:var(--primary);">${d.word}</span>
                    <span class="ayah-badge">Ayah ${d.ayah}</span>
                  </div>
                  
                  <div class="context-phrase">${d.contextPhrase}</div>

                  <div style="font-size:0.92rem; margin-top:4px;">${d.meaningEn}</div>
                  <div style="font-family:var(--font-urdu); direction:rtl; text-align:right; font-size:1rem; margin-top:2px;">${d.meaningUr}</div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      modalBody.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <div>
            <span style="background:var(--accent-light); color:var(--accent); padding:2px 8px; border-radius:4px; font-size:0.8rem; font-weight:600;">${wordObj.pos || 'Morphology'}</span>
            <h2 style="font-family:var(--font-arabic); font-size:2.2rem; color:var(--primary); margin-top:4px;">${wordObj.word}</h2>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Root</div>
            <div style="font-family:var(--font-arabic); font-size:1.6rem; font-weight:700; color:var(--accent);">${wordObj.root || '—'}</div>
          </div>
        </div>

        <div style="background:var(--surface-subtle); border-radius:8px; padding:12px; margin-bottom:16px; border:1px solid var(--border);">
          <div style="font-weight:700; font-size:0.88rem; color:var(--primary); margin-bottom:4px;">Primary Root Meaning:</div>
          <div style="font-size:0.95rem; margin-bottom:4px;">${rootData.english || '—'}</div>
          <div style="font-family:var(--font-urdu); direction:rtl; text-align:right; font-size:1.05rem;">${rootData.urdu || ''}</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:0.9rem; margin-bottom:16px;">
          <div><b>Pattern / Wazn:</b> <code>${wordObj.wazn || '—'}</code></div>
          <div><b>Part of Speech:</b> ${wordObj.pos || '—'}</div>
          <div><b>Grammar:</b> ${wordObj.grammarEnglish || '—'}</div>
          <div style="direction:rtl; text-align:right; font-family:var(--font-urdu);"><b>ترکیب:</b> ${wordObj.grammarUrdu || '—'}</div>
        </div>

        ${derivativesHtml}
      `;

      modal.style.display = "flex";
    };

    window.filterByRoot = function(root) {
      activeFilterRoot = root;
      searchInput.value = "";
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById("modalCloseBtn").onclick = () => {
      document.getElementById("morphologyModal").style.display = "none";
    };

    window.onclick = (e) => {
      const modal = document.getElementById("morphologyModal");
      if (e.target === modal) modal.style.display = "none";
    };

    searchInput.addEventListener("input", () => {
      activeFilterRoot = null;
      renderApp();
    });

    document.getElementById("resetBtn").onclick = () => {
      searchInput.value = "";
      activeFilterRoot = null;
      renderApp();
    };

    renderApp();
  </script>
</body>
</html>
