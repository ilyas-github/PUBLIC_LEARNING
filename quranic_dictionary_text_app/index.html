<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranic Root Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --primary-dark: #059669; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary-dark); font-size: 2rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); }
        .search-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 25px; display: flex; gap: 12px; }
        .search-box input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 1rem; }
        .search-box input:focus { border-color: var(--primary); }
        .results-container { display: flex; flex-direction: column; gap: 20px; }
        .root-card { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); padding: 24px; border-left: 5px solid var(--primary); }
        .arabic-root { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--primary-dark); direction: rtl; }
        .root-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; }
        .root-badge { background: #ecfdf5; color: var(--primary-dark); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 12px; margin-bottom: 4px; }
        .meaning-text { font-size: 1.1rem; font-weight: 500; }
        .details-text, .verse-text { color: #334155; font-size: 0.95rem; background: #f8fafc; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); }
        .no-results { text-align: center; padding: 40px; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Digital Quranic Dictionary</h1>
            <p>Modern Text-Based Root Explorer</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by root letters (e.g., كتب) or meaning..." onkeyup="handleSearch()">
        </div>

        <div id="results" class="results-container"></div>
    </div>

    <script>
        let dictionaryData = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetch('data.json')
                .then(response => response.json())
                .then(data => { 
                    dictionaryData = data; 
                    displayResults(dictionaryData); 
                })
                .catch(error => {
                    console.error("Error loading data:", error);
                    document.getElementById('results').innerHTML = `<div class="no-results">Could not load dictionary data.json</div>`;
                });
        });

        function displayResults(data) {
            const container = document.getElementById('results');
            if (data.length === 0) {
                container.innerHTML = `<div class="no-results">No matching root words found.</div>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="root-card">
                    <div class="root-header">
                        <span class="arabic-root">${item.root}</span>
                        <span class="root-badge">${item.type}</span>
                    </div>
                    <div class="section-title">Primary Meaning</div>
                    <div class="meaning-text">${item.meaning}</div>
                    
                    <div class="section-title">Detailed Breakdown</div>
                    <div class="details-text">${item.details}</div>
                    
                    <div class="section-title">Quranic Reference</div>
                    <div class="verse-text"><em>${item.verse}</em></div>
                </div>
            `).join('');
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = dictionaryData.filter(i => 
                i.root.includes(query) || 
                i.meaning.toLowerCase().includes(query) || 
                i.details.toLowerCase().includes(query)
            );
            displayResults(filtered);
        }
    </script>
</body>
</html>
