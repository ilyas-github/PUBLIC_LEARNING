<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>قرآنی الفاظ کا ذخیرہ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#21875a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="قرآنی جڑیں">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-ar: 'Amiri', serif;
    --font-ur: 'Noto Nastaliq Urdu', serif;
    --font-ui: 'Inter', sans-serif;
  }

  /* ---------- THEMES ---------- */
  [data-theme="light-mint"]{
    --bg: #eef8f2;
    --bg-grad: radial-gradient(circle at 20% -10%, #d9f2e4 0%, #eef8f2 55%);
    --card-bg: #ffffff;
    --card-bg-2: #f4fbf7;
    --text: #17352a;
    --text-secondary: #557066;
    --primary: #21875a;
    --primary-strong: #146843;
    --accent: #e5f6ec;
    --border: #cfe9db;
    --shadow: 0 18px 40px -18px rgba(20, 104, 67, 0.28);
    --danger: #c94c4c;
    --danger-bg: #fbe9e9;
    --success: #1f9d63;
  }
  [data-theme="light-blue"]{
    --bg: #eef4fb;
    --bg-grad: radial-gradient(circle at 80% -10%, #dbeafd 0%, #eef4fb 55%);
    --card-bg: #ffffff;
    --card-bg-2: #f3f8fd;
    --text: #14293e;
    --text-secondary: #4d6885;
    --primary: #2367b8;
    --primary-strong: #184e8e;
    --accent: #e4f0fc;
    --border: #cfe1f5;
    --shadow: 0 18px 40px -18px rgba(24, 78, 142, 0.28);
    --danger: #c94c4c;
    --danger-bg: #fbe9e9;
    --success: #1f9d63;
  }
  [data-theme="dark-charcoal"]{
    --bg: #17181a;
    --bg-grad: radial-gradient(circle at 15% -10%, #26282b 0%, #17181a 55%);
    --card-bg: #201f22;
    --card-bg-2: #262528;
    --text: #f1efe9;
    --text-secondary: #a8a49b;
    --primary: #cf9f43;
    --primary-strong: #e9b654;
    --accent: #2c2a27;
    --border: #38363a;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.55);
    --danger: #e07070;
    --danger-bg: #3a2323;
    --success: #4bbf87;
  }
  [data-theme="dark-blue"]{
    --bg: #0c1524;
    --bg-grad: radial-gradient(circle at 85% -10%, #17253f 0%, #0c1524 55%);
    --card-bg: #101b2e;
    --card-bg-2: #16223a;
    --text: #eaf1fb;
    --text-secondary: #8ea3c2;
    --primary: #4f95e6;
    --primary-strong: #78b1f2;
    --accent: #17233c;
    --border: #223252;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.6);
    --danger: #ef7a7a;
    --danger-bg: #2c1a20;
    --success: #4bbf9a;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: var(--bg-grad);
    background-color: var(--bg);
    font-family: var(--font-ui);
    color: var(--text);
    display:flex;
    justify-content:center;
    padding: 18px 12px 40px;
    transition: background-color .35s ease, color .35s ease;
  }

  .app{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius: var(--radius-lg);
    padding:16px 18px;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .app-header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand-ar{
    font-family: var(--font-ar);
    font-size:26px;
    color: var(--primary-strong);
    line-height:1.3;
  }
  .brand-ur{
    font-family: var(--font-ur);
    font-size:15px;
    color: var(--text-secondary);
  }
  .back-btn{
    border:none; background: var(--accent); color: var(--primary-strong);
    font-family: var(--font-ui); font-weight:700; font-size:12.5px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }

  /* ---------- SURAH PICKER ---------- */
  #surahPicker{
    display:flex; flex-direction:column; gap:14px;
  }
  .picker-header{
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius: var(--radius-lg);
    padding:20px 18px;
    box-shadow: var(--shadow);
    text-align:center;
  }
  .picker-title-ar{
    font-family: var(--font-ar); font-size:28px; color: var(--primary-strong); margin-bottom:4px;
  }
  .picker-title-ur{
    font-family: var(--font-ur); font-size:15px; color: var(--text-secondary);
  }
  .surah-list{ display:flex; flex-direction:column; gap:10px; }
  .surah-card{
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius: var(--radius-md);
    padding:16px 18px;
    box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    cursor:pointer; transition: transform .15s ease;
  }
  .surah-card:active{ transform: scale(0.98); }
  .surah-card-ar{ font-family: var(--font-ar); font-size:24px; color: var(--text); }
  .surah-card-ur{ font-family: var(--font-ur); font-size:13.5px; color: var(--text-secondary); margin-top:2px; }
  .surah-card-desc{ font-family: var(--font-ui); font-size:11px; color: var(--text-secondary); margin-top:4px; }
  .surah-card .chevron{ font-size:20px; }
  .theme-picker{
    display:flex;
    gap:6px;
  }
  .theme-dot{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .theme-dot[data-t="light-mint"]{ background:#21875a; }
  .theme-dot[data-t="light-blue"]{ background:#2367b8; }
  .theme-dot[data-t="dark-charcoal"]{ background:#cf9f43; }
  .theme-dot[data-t="dark-blue"]{ background:#4f95e6; }
  .theme-dot.active{ border-color: var(--text); }

  .tabs{
    display:flex;
    background: var(--accent);
    border-radius: 999px;
    padding:4px;
    gap:4px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-weight:600;
    font-size:13.5px;
    padding:10px 6px;
    border-radius:999px;
    cursor:pointer;
    transition: all .25s ease;
  }
  .tab-btn.active{
    background: var(--primary);
    color:#fff;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.35);
  }

  /* ---------- RESUME BANNER ---------- */
  .resume-banner{
    background: var(--accent);
    border:1px solid var(--border);
    border-radius: var(--radius-md);
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color: var(--text);
  }
  .resume-banner button{
    border:none;
    background: var(--primary);
    color:#fff;
    font-family: var(--font-ui);
    font-weight:700;
    font-size:12.5px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* ---------- LESSON LIST ---------- */
  .weak-panel{
    background: var(--card-bg);
    border:1px solid var(--danger);
    border-radius: var(--radius-md);
    padding:12px 14px;
    box-shadow: var(--shadow);
  }
  .weak-panel-title{
    font-size:13px;
    font-weight:700;
    color: var(--danger);
    margin-bottom:8px;
    font-family: var(--font-ui);
  }
  .weak-badges{ display:flex; flex-wrap:wrap; gap:6px; }
  .weak-badge{
    background: var(--danger-bg);
    color: var(--danger);
    font-family: var(--font-ar);
    font-size:15px;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--danger);
  }

  .root-card{
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius: var(--radius-md);
    padding:14px 16px;
    box-shadow: var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    transition: transform .15s ease, border-color .2s ease;
  }
  .root-card:active{ transform: scale(0.98); }
  .root-card.is-weak{ border-color: var(--danger); }
  .root-left{ display:flex; align-items:center; gap:12px; }
  .root-index{
    font-family: var(--font-ui);
    font-size:11px;
    font-weight:700;
    color: var(--text-secondary);
    background: var(--accent);
    min-width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .root-word{
    font-family: var(--font-ar);
    font-size:24px;
    color: var(--text);
  }
  .root-meaning{
    font-family: var(--font-ur);
    font-size:16px;
    font-weight:600;
    line-height:1.7;
    color: var(--text-secondary);
  }
  .chevron{ color: var(--text-secondary); font-size:18px; }
  .meaning-line{
    display:flex; align-items:flex-start; gap:8px;
    font-family: var(--font-ur); font-size:16px; font-weight:600; line-height:1.7; color: var(--text);
    margin-bottom:8px;
  }
  .meaning-line:last-child{ margin-bottom:0; }
  .meaning-num{
    flex-shrink:0; width:20px; height:20px; border-radius:50%;
    background: var(--accent); color: var(--primary-strong);
    font-family: var(--font-ui); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:2px;
  }

  .list-wrap{ display:flex; flex-direction:column; gap:10px; }

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background: rgba(10,14,20,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-card{
    width:100%; max-width:420px;
    max-height:82vh;
    overflow-y:auto;
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding:20px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    transform: scale(0.85);
    opacity:0;
    transition: transform .28s cubic-bezier(.2,.9,.3,1.3), opacity .22s ease;
  }
  .modal-backdrop.open .modal-card{ transform: scale(1); opacity:1; }
  .modal-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:12px;
  }
  .modal-root-ar{ font-family: var(--font-ar); font-size:32px; color: var(--primary-strong); }
  .modal-root-ur{ font-family: var(--font-ur); font-size:18px; font-weight:600; line-height:1.7; color: var(--text-secondary); margin-top:2px; }
  .modal-close{
    border:none; background: var(--accent); color: var(--text);
    width:32px; height:32px; border-radius:50%;
    font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .derived-title{
    font-size:11.5px; font-weight:700; color: var(--text-secondary);
    font-family: var(--font-ui); text-transform:uppercase; letter-spacing:.04em;
    margin: 14px 0 8px;
  }
  .derived-card{
    background: var(--card-bg-2);
    border:1px solid var(--border);
    border-radius: var(--radius-sm);
    padding:12px 14px;
    margin-bottom:10px;
  }
  .derived-word{ font-family: var(--font-ar); font-size:22px; color: var(--text); }
  .derived-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .pos-badge{
    font-family: var(--font-ui); font-size:10.5px; font-weight:700;
    background: var(--accent); color: var(--primary-strong);
    padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .derived-meaning{ font-family: var(--font-ur); font-size:16px; font-weight:600; line-height:1.7; color: var(--text); margin-bottom:4px; }
  .derived-ref{ font-family: var(--font-ui); font-size:11.5px; color: var(--text-secondary); }

  /* ---------- QUIZ SETUP ---------- */
  .panel{
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius: var(--radius-md);
    padding:16px;
    box-shadow: var(--shadow);
  }
  .panel-title{
    font-family: var(--font-ur); font-size:17px; margin:0 0 12px;
  }
  .option-grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px;
  }
  .opt-btn{
    font-family: var(--font-ui); font-size:13px; font-weight:600;
    padding:10px 4px; border-radius: var(--radius-sm);
    border:1.5px solid var(--border); background: var(--card-bg-2); color: var(--text);
    cursor:pointer; transition: all .2s ease;
  }
  .opt-btn.selected{ border-color: var(--primary); background: var(--accent); color: var(--primary-strong); }
  .mode-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px; }
  .primary-btn{
    width:100%; border:none; background: var(--primary); color:#fff;
    font-family: var(--font-ui); font-weight:700; font-size:15px;
    padding:14px; border-radius: var(--radius-md); cursor:pointer;
  }
  .primary-btn:active{ transform: scale(0.98); }

  /* ---------- QUIZ RUN ---------- */
  .quiz-progress{
    display:flex; align-items:center; justify-content:space-between;
    font-family: var(--font-ui); font-size:12.5px; color: var(--text-secondary);
    margin-bottom:10px;
  }
  .progress-track{
    height:6px; background: var(--accent); border-radius:999px; overflow:hidden; margin-bottom:16px;
  }
  .progress-fill{ height:100%; background: var(--primary); transition: width .3s ease; }
  .question-prompt{
    font-family: var(--font-ui); font-size:12px; font-weight:700; color: var(--text-secondary);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
  }
  .question-focus{
    font-family: var(--font-ar); font-size:34px; text-align:center; color: var(--text);
    background: var(--card-bg-2); border-radius: var(--radius-md); padding:22px 10px; margin-bottom:16px;
    border:1px solid var(--border);
  }
  .mcq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mcq-grid.single-col{ grid-template-columns:1fr; }
  .fact-box{
    margin-top:14px; padding:12px 14px; border-radius: var(--radius-sm);
    background: var(--accent); border:1px solid var(--border);
    font-family: var(--font-ur); font-size:14.5px; line-height:1.8; color: var(--text);
  }
  .fact-box-label{
    font-family: var(--font-ui); font-size:10.5px; font-weight:700; color: var(--primary-strong);
    text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;
  }
  .mcq-btn{
    font-family: var(--font-ur); font-size:15px; text-align:center;
    padding:14px 8px; border-radius: var(--radius-sm);
    border:1.5px solid var(--border); background: var(--card-bg-2); color: var(--text);
    cursor:pointer; transition: all .15s ease;
  }
  .mcq-btn.correct{ background: var(--success); color:#fff; border-color: var(--success); animation: pulseGlow .5s ease; }
  .mcq-btn.wrong{ background: var(--danger); color:#fff; border-color: var(--danger); animation: shakeBtn .4s ease; }

  @keyframes pulseGlow{
    0%{ box-shadow: 0 0 0 0 rgba(31,157,99,0.55); transform:scale(1); }
    50%{ box-shadow: 0 0 0 10px rgba(31,157,99,0); transform:scale(1.04); }
    100%{ box-shadow: 0 0 0 0 rgba(31,157,99,0); transform:scale(1); }
  }
  @keyframes shakeBtn{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }

  /* ---------- FLASHCARD ---------- */
  .flash-card{
    background: var(--card-bg-2); border:1px solid var(--border); border-radius: var(--radius-md);
    padding:26px 14px; text-align:center; margin-bottom:14px; cursor:pointer; min-height:150px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  .flash-front{ font-family: var(--font-ar); font-size:38px; color: var(--text); }
  .flash-hint{ font-family: var(--font-ui); font-size:11.5px; color: var(--text-secondary); }
  .flash-back-meaning{ font-family: var(--font-ur); font-size:18px; color: var(--primary-strong); }
  .flash-derived-mini{ font-family: var(--font-ar); font-size:16px; color: var(--text-secondary); }
  .flash-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .know-btn, .forgot-btn{
    border:none; font-family: var(--font-ui); font-weight:700; font-size:14px;
    padding:13px; border-radius: var(--radius-sm); cursor:pointer; color:#fff;
  }
  .know-btn{ background: var(--success); }
  .forgot-btn{ background: var(--danger); }

  /* ---------- RESULTS ---------- */
  .result-score{
    text-align:center; font-family: var(--font-ui); font-size:44px; font-weight:800;
    color: var(--primary-strong); margin: 6px 0 2px;
  }
  .result-sub{ text-align:center; font-family: var(--font-ur); font-size:15px; color: var(--text-secondary); margin-bottom:16px; }

  .hidden{ display:none !important; }
  body.no-scroll{ overflow:hidden; }
</style>
</head>
<body data-theme="light-mint">
<div class="app">

  <!-- SURAH PICKER -->
  <div id="surahPicker">
    <div class="picker-header">
      <div class="picker-title-ar">قرآنی الفاظ کا ذخیرہ</div>
      <div class="picker-title-ur">مطالعے کے لیے سورت منتخب کریں</div>
    </div>
    <div class="surah-list" id="surahList"></div>
    <div style="font-family:var(--font-ui); font-size:10.5px; color:var(--text-secondary); text-align:center; padding:4px 10px;">
      ✓ تمام آیات اور حوالہ جات براہِ راست قرآنی متن اور معارف القرآن سے تصدیق شدہ ہیں
    </div>
  </div>

  <div id="mainApp" class="hidden">

  <div class="app-header">
    <div class="app-header-top">
      <button class="back-btn" id="backToPickerBtn">‹ تمام سورتیں</button>
      <div class="theme-picker" id="themePicker"></div>
    </div>
    <div class="brand" style="margin-bottom:8px;">
      <div class="brand-ar" id="brandAr"></div>
      <div class="brand-ur" id="brandUr"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="lessons">اسباق کی فہرست</button>
      <button class="tab-btn" data-tab="quiz">سوالات</button>
    </div>
  </div>

  <div id="resumeBanner" class="resume-banner hidden">
    <span id="resumeText"></span>
    <button id="resumeBtn">واپس جائیں</button>
  </div>

  <!-- LESSONS TAB -->
  <div id="lessonsTab">
    <div id="weakPanel" class="weak-panel hidden">
      <div class="weak-panel-title">کمزور جڑیں — دوبارہ مطالعہ کریں</div>
      <div class="weak-badges" id="weakBadges"></div>
    </div>
    <div class="list-wrap" id="rootList"></div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quizTab" class="hidden">

    <div id="quizSetup" class="panel">
      <div class="panel-title">سوالات کی ترتیب</div>
      <div style="font-family:var(--font-ui);font-size:12px;color:var(--text-secondary);margin-bottom:8px;">کتنے سوالات؟</div>
      <div class="option-grid" id="lengthOptions">
        <button class="opt-btn" data-len="5">5</button>
        <button class="opt-btn" data-len="10">10</button>
        <button class="opt-btn" data-len="20">تمام 20</button>
      </div>
      <div style="font-family:var(--font-ui);font-size:12px;color:var(--text-secondary);margin-bottom:8px;">طریقہ منتخب کریں</div>
      <div class="mode-grid" id="modeOptions">
        <button class="opt-btn" data-mode="mcq">MCQ</button>
        <button class="opt-btn" data-mode="flash">فلیش کارڈز</button>
      </div>
      <button class="primary-btn" id="startQuizBtn">سوالات شروع کریں</button>
    </div>

    <div id="quizRun" class="panel hidden">

/* ============ AUDIO ============ */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  return audioCtx;
}
function playCorrect(){
  try{
    const ctx = getCtx();
    const now = ctx.currentTime;
    [523.25, 659.25].forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i*0.12);
      gain.gain.linearRampToValueAtTime(0.22, now + i*0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.12 + 0.22);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i*0.12);
      osc.stop(now + i*0.12 + 0.25);
    });
  }catch(e){}
}
function playWrong(){
  try{
    const ctx = getCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(90, now+0.28);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.32);
  }catch(e){}
}

        <div class="root-index">${i+1}</div>
        <div>

          <div class="root-meaning">${r.meaning}</div>
        </div>
      </div>
      <div class="chevron">›</div>`;
    card.addEventListener('click', ()=> openModal(r));
    wrap.appendChild(card);
  });
  renderWeakPanel();
}
function renderWeakPanel(){
  const panel = document.getElementById('weakPanel');
  const badgeWrap = document.getElementById('weakBadges');
  const weak = state.quiz && state.quiz.weak ? state.quiz.weak : null;
  if(!weak || weak.size===0){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  badgeWrap.innerHTML = '';
  [...weak].forEach(id=>{
    const r = currentRoots().find(x=>x.id===id);
    if(!r) return;
    const b = document.createElement('span');
    b.className = 'weak-badge';
    b.textContent = r.root;
    badgeWrap.appendChild(b);
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestionPool(rootsSubset){
  const pool = [];
  rootsSubset.forEach(r=>{
    // Root -> Basic meaning
    const meaningOptions = shuffle([r.meaning, ...r.distractorMeanings]);
    pool.push({
      type:'root-to-meaning',
      rootId: r.id,
      focus: r.root,
      promptLabel: 'اس جڑ کا بنیادی معنی منتخب کریں',
      correct: r.meaning,
      options: meaningOptions
    });
    // Derived word -> Root
    const derivedPick = r.derived[Math.floor(Math.random()*r.derived.length)];
    const rootOptions = shuffle([r.root, ...r.distractorRoots]);
    pool.push({
      type:'derived-to-root',
      rootId: r.id,
      focus: derivedPick.word,
      promptLabel: 'اس لفظ کی اصل جڑ منتخب کریں',
      correct: r.root,
      options: rootOptions
    });
  });
  return pool;
}

function interleave(pool){
  let arr = shuffle(pool);
  // repair consecutive same-root collisions
  for(let i=1;i<arr.length;i++){
    if(arr[i].rootId === arr[i-1].rootId){
      let swapIdx = -1;
      for(let j=i+1;j<arr.length;j++){
        if(arr[j].rootId !== arr[i-1].rootId && arr[j].rootId !== (arr[i+1] ? arr[i+1].rootId : null)){
          swapIdx = j; break;
        }
      }
      if(swapIdx === -1){
        for(let j=i+1;j<arr.length;j++){
          if(arr[j].rootId !== arr[i-1].rootId){ swapIdx = j; break; }
        }
      }
      if(swapIdx !== -1){
        [arr[i], arr[swapIdx]] = [arr[swapIdx], arr[i]];
      }
    }
  }
  return arr;
}

function startQuiz(len, mode){
  const subset = shuffle(currentRoots()).slice(0, len);
  let questions;
  if(mode === 'mcq'){
    questions = interleave(buildQuestionPool(subset)).slice(0, Math.max(len, Math.min(len*2, 20)));
    // For a clean session, cap question count to len*2 or fewer for very long sessions is fine as-is
  } else {
    questions = shuffle(subset).map(r=>({ type:'flash', rootId:r.id, root:r }));
  }
  state.quiz = {
    mode, length: len, questions, index:0, score:0, streak:0,
    weak: (state.quiz && state.quiz.weak) ? state.quiz.weak : new Set(),
    active: true
  };
  showQuizScreen('run');
  renderQuestion();
}

function showQuizScreen(which){
  document.getElementById('quizSetup').classList.toggle('hidden', which!=='setup');
  document.getElementById('quizRun').classList.toggle('hidden', which!=='run');
  document.getElementById('quizResult').classList.toggle('hidden', which!=='result');
  updateResumeBanner();
}

/* ============ QUIZ RUN ============ */
function updateProgressBar(){
  const q = state.quiz;
  document.getElementById('progressLabel').textContent = `سوال ${q.index+1} از ${q.questions.length}`;
  document.getElementById('scoreLabel').textContent = `اسکور: ${q.score}`;
  document.getElementById('progressFill').style.width = `${(q.index/q.questions.length)*100}%`;
  updateResumeBanner();
}

function renderQuestion(){
  const q = state.quiz;
  updateProgressBar();
  const item = q.questions[q.index];
  document.getElementById('mcqBlock').classList.toggle('hidden', q.mode!=='mcq');
  document.getElementById('flashBlock').classList.toggle('hidden', q.mode!=='flash');

  if(q.mode === 'mcq'){
    renderMcq(item);
  } else {
    renderFlash(item);
  }
}

function renderMcq(item){
  document.getElementById('mcqPromptLabel').textContent = item.promptLabel;
  document.getElementById('mcqFocus').textContent = item.focus;
  document.getElementById('factBox').classList.add('hidden');
  document.getElementById('mcqNextBtn').classList.add('hidden');
  const grid = document.getElementById('mcqOptions');
  grid.innerHTML = '';
  const longText = item.options.some(o => o.length > 15);
  grid.classList.toggle('single-col', longText);
  item.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'mcq-btn';
    b.textContent = opt;
    b.addEventListener('click', ()=> handleMcqAnswer(opt, item, b));
    grid.appendChild(b);
  });
}

function handleMcqAnswer(chosen, item, btnEl){
  const q = state.quiz;
  const allBtns = document.querySelectorAll('#mcqOptions .mcq-btn');
  allBtns.forEach(b=> b.style.pointerEvents = 'none');
  const isCorrect = chosen === item.correct;
  if(isCorrect){
    btnEl.classList.add('correct');
    q.score++; q.streak++;
    playCorrect();
  } else {
    btnEl.classList.add('wrong');
    allBtns.forEach(b=>{ if(b.textContent === item.correct) b.classList.add('correct'); });
    q.weak.add(item.rootId);
    q.streak = 0;
    playWrong();
  }
  const rootData = currentRoots().find(r => r.id === item.rootId);
  if(rootData && rootData.rootFamilyFact){
    document.getElementById('factBoxText').textContent = rootData.rootFamilyFact;
    document.getElementById('factBox').classList.remove('hidden');
  }
  document.getElementById('mcqNextBtn').classList.remove('hidden');
}
document.getElementById('mcqNextBtn').addEventListener('click', ()=> advanceQuiz());

function renderFlash(item){
  document.getElementById('flashFront').textContent = item.root.root;
  document.getElementById('flashHint').textContent = 'دبانے پر معنی دیکھیں';
  document.getElementById('flashActions').classList.add('hidden');
  const card = document.getElementById('flashCard');
  card.onclick = ()=> revealFlash(item);
}
function revealFlash(item){
  document.getElementById('flashFront').innerHTML =
    `<div class="flash-back-meaning">${item.root.meaning}</div>
     <div class="flash-derived-mini">${item.root.derived[0].word} — ${item.root.derived[0].meaning}</div>`;
  document.getElementById('flashHint').textContent = '';
  document.getElementById('flashActions').classList.remove('hidden');
  document.getElementById('flashCard').onclick = null;
}
document.getElementById('knowBtn').addEventListener('click', ()=>{
  state.quiz.score++;
  playCorrect();
  advanceQuiz();
});
document.getElementById('forgotBtn').addEventListener('click', ()=>{
  const item = state.quiz.questions[state.quiz.index];
  state.quiz.weak.add(item.rootId);
  playWrong();
  advanceQuiz();
});

function advanceQuiz(){
  const q = state.quiz;
  q.index++;
  if(q.index >= q.questions.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}
function finishQuiz(){
  const q = state.quiz;
  q.active = false;
  showQuizScreen('result');
  document.getElementById('resultScore').textContent = `${q.score} / ${q.questions.length}`;
  const pct = Math.round((q.score/q.questions.length)*100);
  let msg = 'ماشاءاللہ! بہت خوب';
  if(pct < 50) msg = 'مزید مشق کی ضرورت ہے';
  else if(pct < 80) msg = 'اچھی کارکردگی، جاری رکھیں';
  document.getElementById('resultSub').textContent = `${msg} — ${pct}% درست`;
  renderRootList();
  updateResumeBanner();
}
document.getElementById('backToSetupBtn').addEventListener('click', ()=>{
  showQuizScreen('setup');
});

/* ============ SURAH PICKER / NAVIGATION ============ */
function renderSurahPicker(){
  const wrap = document.getElementById('surahList');
  wrap.innerHTML = '';
  Object.values(SURAHS).forEach(s=>{
    const card = document.createElement('div');
    card.className = 'surah-card';
    card.innerHTML = `
      <div>
        <div class="surah-card-ar">${s.titleAr}</div>
        <div class="surah-card-ur">${s.titleUr}</div>
        <div class="surah-card-desc">${s.cardDesc}</div>
      </div>
      <div class="chevron">›</div>`;
    card.addEventListener('click', ()=> openSurah(s.key));
    wrap.appendChild(card);
  });
}
function openSurah(key){
  state.currentSurah = key;
  state.quiz = null;
  document.getElementById('brandAr').textContent = SURAHS[key].titleAr;
  document.getElementById('brandUr').textContent = SURAHS[key].titleUr;
  document.getElementById('surahPicker').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  switchTab('lessons');
  renderRootList();
  showQuizScreen('setup');
  selectedLen = null; selectedMode = null;
  document.querySelectorAll('#lengthOptions .opt-btn, #modeOptions .opt-btn').forEach(b=>b.classList.remove('selected'));
}
document.getElementById('backToPickerBtn').addEventListener('click', ()=>{
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('surahPicker').classList.remove('hidden');
});

/* ============ INIT ============ */
initThemePicker();
renderSurahPicker();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
