<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quranic Root Words Explorer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-box:focus {
      border-color: #d95338;
    }

    .root-card {
      width: 100%;
      margin-bottom: 20px;
      padding: 16px;
      background-color: #1e1b18;
      border: 1.5px solid #d95338;
      border-radius: 12px;
      overflow: hidden;
    }

    .root-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .root-arabic {
      font-size: 24px;
      font-weight: bold;
      color: #d95338;
      direction: rtl;
    }

    .root-english {
      font-size: 16px;
      color: #aaa;
    }

    .root-meaning-en {
      font-size: 15px;
      color: #ddd;
      margin-bottom: 4px;
    }

    .root-meaning-ur {
      font-size: 16px;
      color: #ffffff;
      font-weight: 500;
      direction: rtl;
      text-align: right;
      margin-bottom: 12px;
    }

    .divider {
      border: 0;
      height: 1px;
      background: #44342a;
      margin: 12px 0;
    }

    .derived-card {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background-color: #141210;
      border: 1px solid #d4a359;
      border-radius: 10px;
    }

    .derived-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .derived-title {
      font-size: 18px;
      font-weight: bold;
      color: #d4a359;
      direction: rtl;
    }

    .derived-trans {
      font-size: 14px;
      color: #bbb;
      font-style: normal;
    }

    .ayah-arabic {
      font-size: 18px;
      color: #ffffff;
      direction: rtl;
      text-align: right;
      line-height: 1.6;
      margin: 8px 0;
    }

    .ayah-english {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .ayah-urdu {
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
      direction: rtl;
      text-align: right;
    }

    .ref-badge {
      font-size: 12px;
      font-weight: bold;
      color: #d4a359;
    }
  </style>
</head>
<body>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by root (e.g. k t b, ك ت ب, write)...">
    <div id="rootsContainer"></div>
  </div>

  <script src="rootsData.js"></script>
  <script>
    function renderRoots(data) {
      const container = document.getElementById('rootsContainer');
      container.innerHTML = '';

      data.forEach(item => {
        const rootCard = document.createElement('div');
        rootCard.className = 'root-card';

        let derivedHTML = item.derivedForms.map(df => `
          <div class="derived-card">
            <div class="derived-header">
              <span class="derived-title">${df.arabic} <span class="derived-trans">(${df.english})</span></span>
            </div>
            <div class="ayah-arabic">${df.ayahArabic}</div>
            <div class="ayah-english"><span class="ref-badge">[${df.reference}]</span> ${df.ayahEnglish}</div>
            <div class="ayah-urdu">${df.ayahUrdu}</div>
          </div>
        `).join('');

        rootCard.innerHTML = `
          <div class="root-header">
            <span class="root-arabic">${item.rootArabic}</span>
            <span class="root-english">(${item.rootEnglish})</span>
          </div>
          <div class="root-meaning-en">${item.meaningEnglish}</div>
          <div class="root-meaning-ur">${item.meaningUrdu}</div>
          <hr class="divider">
          ${derivedHTML}
        `;

        container.appendChild(rootCard);
      });
    }

    // Initial Render
    renderRoots(rootsData);

    // Filter Logic supporting English letters and Arabic script
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = rootsData.filter(item => 
        item.rootArabic.includes(query) ||
        item.rootEnglish.toLowerCase().includes(query) ||
        item.meaningEnglish.toLowerCase().includes(query) ||
        item.meaningUrdu.includes(query)
      );
      renderRoots(filtered);
    });
  </script>
</body>
</html>
